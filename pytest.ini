[pytest]
# rootdir is the project root, so `src` is importable without installing the
# package — the same import style the services use (`uvicorn src.api.main:app`).
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # Surface our own deprecations; third-party ones are not actionable here.
    default
    ignore::PendingDeprecationWarning:shap.*

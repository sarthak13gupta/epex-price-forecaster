<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Walk-forward validation timeline. Three successive folds each use a 731-day rolling training window ending the day before a one-month test period. The window slides forward for each fold, and a 14-day warm-up tail at the end of each training window seeds the thermal inertia for the test period.">
          <defs>
            <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <polygon points="0,1 10,5 0,9" fill="#131B1E"></polygon>
            </marker>
          </defs>

          <!-- time axis -->
          <line x1="60" y1="212" x2="860" y2="212" stroke="#131B1E" stroke-width="1.2" marker-end="url(#af)"></line>
          <text x="860" y="234" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E" opacity="0.7">time</text>

          <!-- fold 1 -->
          <text x="16" y="60" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E" opacity="0.7">fold 01</text>
          <rect x="60" y="44" width="420" height="26" rx="2" fill="none" stroke="#131B1E" stroke-width="1.3"></rect>
          <rect x="446" y="44" width="34" height="26" fill="#A9541F" opacity="0.28"></rect>
          <rect x="484" y="44" width="72" height="26" rx="2" fill="#0E5D6E" opacity="0.85"></rect>
          <text x="270" y="61" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E">731-day training window</text>

          <!-- fold 2 -->
          <text x="16" y="112" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E" opacity="0.7">fold 02</text>
          <rect x="132" y="96" width="420" height="26" rx="2" fill="none" stroke="#131B1E" stroke-width="1.3"></rect>
          <rect x="518" y="96" width="34" height="26" fill="#A9541F" opacity="0.28"></rect>
          <rect x="556" y="96" width="72" height="26" rx="2" fill="#0E5D6E" opacity="0.85"></rect>

          <!-- fold 3 -->
          <text x="16" y="164" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E" opacity="0.7">fold 03</text>
          <rect x="204" y="148" width="420" height="26" rx="2" fill="none" stroke="#131B1E" stroke-width="1.3"></rect>
          <rect x="590" y="148" width="34" height="26" fill="#A9541F" opacity="0.28"></rect>
          <rect x="628" y="148" width="72" height="26" rx="2" fill="#0E5D6E" opacity="0.85"></rect>

          <!-- slide arrows -->
          <line x1="60" y1="80" x2="128" y2="80" stroke="#131B1E" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#af)" opacity="0.55"></line>
          <line x1="132" y1="132" x2="200" y2="132" stroke="#131B1E" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#af)" opacity="0.55"></line>
          <text x="94" y="94" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#131B1E" opacity="0.6">slides</text>

          <!-- legend -->
          <rect x="60" y="186" width="16" height="11" rx="1" fill="none" stroke="#131B1E" stroke-width="1.2"></rect>
          <text x="84" y="196" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E">train</text>

          <rect x="140" y="186" width="16" height="11" fill="#A9541F" opacity="0.28"></rect>
          <text x="164" y="196" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E">14-day warm-up tail</text>

          <rect x="300" y="186" width="16" height="11" rx="1" fill="#0E5D6E" opacity="0.85"></rect>
          <text x="324" y="196" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E">test month · exogenous inputs simulated, never observed</text>
        </svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Service topology: Streamlit frontend calls the FastAPI backend over HTTP; FastAPI loads a fitted model bundle from the MLflow registry at startup; the training job writes runs and models into MLflow and reads raw data from storage.">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,1 10,5 0,9" fill="#131B1E"></polygon>
            </marker>
            <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,1 10,5 0,9" fill="#0E5D6E"></polygon>
            </marker>
          </defs>

          <!-- runtime boundary -->
          <rect x="16" y="52" width="546" height="152" rx="4" fill="none" stroke="#131B1E" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"></rect>
          <text x="26" y="44" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#131B1E" letter-spacing="1.4">REQUEST PATH · ALWAYS WARM</text>

          <!-- Streamlit -->
          <rect x="40" y="88" width="150" height="76" rx="3" fill="none" stroke="#131B1E" stroke-width="1.5"></rect>
          <text x="115" y="115" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#131B1E">Streamlit</text>
          <text x="115" y="133" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#131B1E" opacity="0.75">presentation only</text>
          <text x="115" y="149" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E" opacity="0.6">:8501</text>

          <!-- FastAPI -->
          <rect x="300" y="88" width="176" height="76" rx="3" fill="none" stroke="#0E5D6E" stroke-width="2"></rect>
          <text x="388" y="115" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#0E5D6E">FastAPI</text>
          <text x="388" y="133" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0E5D6E" opacity="0.85">cascade + price model</text>
          <text x="388" y="149" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#0E5D6E" opacity="0.7">:8000</text>

          <!-- arrow streamlit -> fastapi -->
          <line x1="192" y1="118" x2="296" y2="118" stroke="#131B1E" stroke-width="1.5" marker-end="url(#ar)"></line>
          <text x="244" y="110" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E">POST /predict</text>
          <line x1="296" y1="140" x2="192" y2="140" stroke="#131B1E" stroke-width="1.5" marker-end="url(#ar)" opacity="0.6"></line>
          <text x="244" y="156" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E" opacity="0.75">price path + drivers</text>

          <!-- MLflow -->
          <rect x="640" y="76" width="220" height="100" rx="3" fill="none" stroke="#131B1E" stroke-width="1.5"></rect>
          <text x="750" y="104" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#131B1E">MLflow</text>
          <text x="750" y="122" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#131B1E" opacity="0.75">tracking + registry</text>
          <text x="750" y="140" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E" opacity="0.6">sqlite / RDS + artifacts</text>
          <text x="750" y="158" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E" opacity="0.6">:5000</text>

          <!-- fastapi <- mlflow : load once -->
          <line x1="636" y1="120" x2="482" y2="120" stroke="#0E5D6E" stroke-width="2" marker-end="url(#ar-acc)"></line>
          <text x="559" y="112" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#0E5D6E">load bundle</text>
          <text x="559" y="136" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#0E5D6E" opacity="0.8">once, at startup</text>

          <!-- Training job -->
          <rect x="300" y="252" width="176" height="60" rx="3" fill="none" stroke="#131B1E" stroke-width="1.5" stroke-dasharray="5 3"></rect>
          <text x="388" y="277" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#131B1E">Training job</text>
          <text x="388" y="295" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#131B1E" opacity="0.75">offline, scheduled</text>

          <!-- training -> mlflow -->
          <polyline points="480,282 750,282 750,180" fill="none" stroke="#131B1E" stroke-width="1.5" marker-end="url(#ar)"></polyline>
          <text x="620" y="274" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E">logs runs, registers model</text>

          <!-- storage -->
          <rect x="40" y="252" width="150" height="60" rx="3" fill="none" stroke="#131B1E" stroke-width="1.5"></rect>
          <text x="115" y="277" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#131B1E">Raw data</text>
          <text x="115" y="295" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E" opacity="0.7">disk or S3</text>

          <line x1="192" y1="282" x2="296" y2="282" stroke="#131B1E" stroke-width="1.5" marker-end="url(#ar)"></line>
          <text x="244" y="274" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#131B1E">reads</text>
        </svg>
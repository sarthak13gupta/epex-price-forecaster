# Manual, read-only proof that GitHub can exchange its OIDC identity for the
# repository-scoped AWS role. This is deliberately separate from image publish
# so authentication can be diagnosed without building or mutating ECR.
name: Verify AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: assume role and read ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Inspect the non-secret OIDC claims
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          separator = "&" if "?" in os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] else "?"
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + separator + "audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible = {
              key: claims.get(key)
              for key in ("aud", "sub", "repository", "ref", "workflow", "job_workflow_ref")
          }
          print(json.dumps(visible, indent=2, sort_keys=True))
          assert claims["aud"] == "sts.amazonaws.com"
          assert claims["repository"] == os.environ["EXPECTED_REPOSITORY"]
          owner, repository = os.environ["EXPECTED_REPOSITORY"].split("/", 1)
          expected_subject_prefix = (
              f"repo:{owner}@{os.environ['EXPECTED_OWNER_ID']}/"
              f"{repository}@{os.environ['EXPECTED_REPOSITORY_ID']}:"
          )
          assert claims["sub"].startswith(expected_subject_prefix)
          PY

      - name: Assume the repository's AWS role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-oidc-check-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify caller and repository scope
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          case "$arn" in
            *:assumed-role/github-actions-ecr-push/*) ;;
            *) echo "::error::unexpected AWS caller role"; exit 1 ;;
          esac

          repository=$(aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryName' \
            --output text)
          test "$repository" = "$ECR_REPOSITORY"

          {
            echo "### AWS OIDC verification passed"
            echo "- Role: \`github-actions-ecr-push\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- ECR repository: \`$repository\`"
            echo "- Operations performed: STS identity and ECR read only"
          } >> "$GITHUB_STEP_SUMMARY"
